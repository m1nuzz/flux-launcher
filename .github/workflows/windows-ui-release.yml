name: Windows UI release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing or new release tag, for example v0.1.38"
        required: true
        type: string
      runner_label:
        description: "Configured GitHub larger-runner label (use windows-latest for standard VM)"
        required: false
        default: windows-latest
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ inputs.runner_label || 'windows-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binaries
        shell: pwsh
        run: |
          cargo build --release --target x86_64-pc-windows-msvc -p flux-launcher -p flow-plugin-fixture -p flux-obsidian-plugin -p flux-google-plugin
          $pluginRoot = Join-Path $env:APPDATA "FluxLauncher\Plugins\NativeFlowFixture"
          New-Item -ItemType Directory -Force -Path $pluginRoot | Out-Null
          Copy-Item ./tests/fixtures/flow-native-plugin/plugin.json (Join-Path $pluginRoot "plugin.json") -Force
          Copy-Item ./target/x86_64-pc-windows-msvc/release/flow-plugin-fixture.exe (Join-Path $pluginRoot "fixture-plugin.exe") -Force

      - name: Enable DWM effects and collect preflight diagnostics
        shell: pwsh
        run: ./scripts/enable-dwm-smoke.ps1 -OutputDirectory ./artifacts/windows-ui-release

      - name: Capture empty and query UI states
        shell: pwsh
        env:
          # Force the GPU path when the runner supports it; Flux still checks
          # SM_REMOTESESSION and DwmIsCompositionEnabled before using transparency.
          WINDUI_D2D: "1"
        run: |
          ./scripts/capture-mica.ps1 `
            -Executable ./target/x86_64-pc-windows-msvc/release/flux-launcher.exe `
            -OutputDirectory ./artifacts/windows-ui-release

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./artifacts/windows-ui-release/package | Out-Null
          Copy-Item ./target/x86_64-pc-windows-msvc/release/flux-launcher.exe ./artifacts/windows-ui-release/package/FluxLauncher-Windows11-x64.exe
          Copy-Item ./target/x86_64-pc-windows-msvc/release/flow-plugin-fixture.exe ./artifacts/windows-ui-release/package/flow-plugin-fixture.exe
          New-Item -ItemType Directory -Force -Path ./artifacts/windows-ui-release/package/FluxPlugins/Obsidian | Out-Null
          New-Item -ItemType Directory -Force -Path ./artifacts/windows-ui-release/package/FluxPlugins/Google | Out-Null
          Copy-Item ./crates/obsidian-plugin/plugin.json ./artifacts/windows-ui-release/package/FluxPlugins/Obsidian/plugin.json
          Copy-Item ./target/x86_64-pc-windows-msvc/release/flux-obsidian-plugin.exe ./artifacts/windows-ui-release/package/FluxPlugins/Obsidian/flux-obsidian-plugin.exe
          Copy-Item ./crates/google-plugin/plugin.json ./artifacts/windows-ui-release/package/FluxPlugins/Google/plugin.json
          Copy-Item ./target/x86_64-pc-windows-msvc/release/flux-google-plugin.exe ./artifacts/windows-ui-release/package/FluxPlugins/Google/flux-google-plugin.exe
          Get-ChildItem ./artifacts/windows-ui-release/package -File -Recurse | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize

      - name: Publish UI release and screenshots
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Flux Launcher ${{ inputs.release_tag }}
          generate_release_notes: true
          body: |
            Flux Launcher Windows 11 x64 UI release.

            This workflow captures the compact transparent launcher, repeated activation, query expansion, keyboard navigation, action mode, Settings, native Flow fixture, and current provider smoke evidence.

            The workflow records DWM preflight diagnostics. GitHub standard runners may not expose live DWM Acrylic because of remote desktop composition; validate final material appearance on a physical Windows 11 desktop or a configured GPU/larger runner.
          files: |
            ./artifacts/windows-ui-release/package/FluxLauncher-Windows11-x64.exe
            ./artifacts/windows-ui-release/package/flow-plugin-fixture.exe
            ./artifacts/windows-ui-release/package/FluxPlugins/Obsidian/plugin.json
            ./artifacts/windows-ui-release/package/FluxPlugins/Obsidian/flux-obsidian-plugin.exe
            ./artifacts/windows-ui-release/package/FluxPlugins/Google/plugin.json
            ./artifacts/windows-ui-release/package/FluxPlugins/Google/flux-google-plugin.exe
            ./artifacts/windows-ui-release/mica-desktop.png
            ./artifacts/windows-ui-release/keyboard-selection.png
            ./artifacts/windows-ui-release/actions-panel.png
            ./artifacts/windows-ui-release/settings-panel.png
            ./artifacts/windows-ui-release/dwm-preflight.json
            ./artifacts/windows-ui-release/launcher.stderr.log
