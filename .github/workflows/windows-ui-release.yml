name: Windows UI release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing or new release tag, for example v0.1.38"
        required: true
        type: string
      runner_label:
        description: "Configured GitHub larger-runner label (use windows-latest for standard VM)"
        required: false
        default: windows-latest
        type: string
      release_channel:
        description: "Publish channel; beta is the safe default"
        required: false
        default: beta
        type: choice
        options:
          - beta
          - stable

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ inputs.runner_label || 'windows-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build release binaries
        shell: pwsh
        run: |
          cargo build --release --target x86_64-pc-windows-msvc -p flux-launcher -p flow-plugin-fixture -p flux-plugin-example
          $pluginRoot = Join-Path $env:APPDATA "FluxLauncher\Plugins\NativeFlowFixture"
          New-Item -ItemType Directory -Force -Path $pluginRoot | Out-Null
          Copy-Item ./tests/fixtures/flow-native-plugin/plugin.json (Join-Path $pluginRoot "plugin.json") -Force
          Copy-Item ./target/x86_64-pc-windows-msvc/release/flow-plugin-fixture.exe (Join-Path $pluginRoot "fixture-plugin.exe") -Force

      - name: Smoke self-spawned native plugin host
        shell: pwsh
        run: |
          $nativeRoot = Join-Path $env:RUNNER_TEMP "flux-native-plugins"
          $nativePlugin = Join-Path $nativeRoot "example"
          New-Item -ItemType Directory -Force -Path $nativePlugin | Out-Null
          Copy-Item ./crates/flux-plugin-example/plugin.toml (Join-Path $nativePlugin "plugin.toml") -Force
          Copy-Item ./target/x86_64-pc-windows-msvc/release/flux_plugin_example.dll (Join-Path $nativePlugin "flux_plugin_example.dll") -Force
          $requests = Join-Path $env:RUNNER_TEMP "flux-native-plugin-requests.jsonl"
          @'
          {"jsonrpc":"2.0","id":1,"method":"query","params":{"query":"ex hello","action_keyword":"ex","locale":"en-US"}}
          {"jsonrpc":"2.0","id":2,"method":"execute","plugin":"Example Native","params":{"action":{"type":"copy_text","text":"hello"}}}
          '@ | Set-Content -Path $requests -Encoding utf8
          $responsePath = Join-Path $env:RUNNER_TEMP "flux-native-plugin-responses.jsonl"
          $process = Start-Process `
            -FilePath "./target/x86_64-pc-windows-msvc/release/flux-launcher.exe" `
            -ArgumentList @("--plugin-host", $nativeRoot) `
            -RedirectStandardInput $requests `
            -RedirectStandardOutput $responsePath `
            -NoNewWindow `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) { throw "Native plugin host exited with code $($process.ExitCode)" }
          $responses = Get-Content $responsePath -Raw
          Write-Host $responses
          if ($responses -notmatch 'Example: hello') { throw "Native host query smoke failed" }
          if ($responses -notmatch '"success":true') { throw "Native host execute smoke failed" }

      - name: Run Windows updater and settings regression tests
        shell: pwsh
        run: cargo test -p flux-launcher -p flux-core --target x86_64-pc-windows-msvc --all-targets

      - name: Smoke Steam-style shortcut icon extraction
        shell: pwsh
        run: ./scripts/shortcut-icon-smoke.ps1 -Executable ./target/x86_64-pc-windows-msvc/release/flux-launcher.exe -WorkDirectory ./artifacts/windows-ui-release/shortcut-icon-smoke

      - name: Smoke single-instance and Everything process guard
        shell: pwsh
        run: ./scripts/single-instance-smoke.ps1 -Executable ./target/x86_64-pc-windows-msvc/release/flux-launcher.exe -WorkDirectory ./artifacts/windows-ui-release/single-instance-smoke

      - name: Enable DWM effects and collect preflight diagnostics
        shell: pwsh
        run: ./scripts/enable-dwm-smoke.ps1 -OutputDirectory ./artifacts/windows-ui-release

      - name: Capture UI states and verify exact native visual preview HWND
        shell: pwsh
        env:
          # Force the GPU path when the runner supports it; Flux still checks
          # SM_REMOTESESSION and DwmIsCompositionEnabled before using transparency.
          WINDUI_D2D: "1"
          # Keep first-run onboarding out of deterministic desktop capture.
          FLUX_DISABLE_EVERYTHING_PROMPT: "1"
        run: |
          ./scripts/capture-mica.ps1 `
            -Executable ./target/x86_64-pc-windows-msvc/release/flux-launcher.exe `
            -OutputDirectory ./artifacts/windows-ui-release `
            -QueryResponsivenessSmoke `
            -FocusToggleSmoke `
            -DeactivationClickSmoke `
            -FolderLaunchSmoke `
            -VisualSettingsSmoke

      - name: Upload UI smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flux-launcher-windows-ui-smoke-diagnostics
          path: artifacts/windows-ui-release
          if-no-files-found: warn

      - name: Sign stable launcher binaries before packaging
        if: inputs.release_channel == 'stable'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          ./scripts/sign-windows-release.ps1 `
            -Files @(
              "./target/x86_64-pc-windows-msvc/release/flux-launcher.exe"
            ) `
            -RequireSigning

      - name: Prepare installer and portable release files
        shell: pwsh
        run: |
          $version = "${{ inputs.release_tag }}".TrimStart("v")
          ./scripts/build-installer.ps1 `
            -AppVersion $version `
            -OutputDirectory ./artifacts/windows-ui-release/package
          Get-ChildItem ./artifacts/windows-ui-release/package -File -Recurse | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize

      - name: Sign stable release artifacts
        if: inputs.release_channel == 'stable'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          ./scripts/sign-windows-release.ps1 `
            -ArtifactDirectory ./artifacts/windows-ui-release/package `
            -RequireSigning

      - name: Smoke installer, startup opt-out, tray launch, and uninstall
        shell: pwsh
        run: |
          ./scripts/installer-smoke.ps1 `
            -Installer ./artifacts/windows-ui-release/package/FluxLauncher-Setup.exe `
            -ExpectedExe ./target/x86_64-pc-windows-msvc/release/flux-launcher.exe `
            -WorkDirectory ./artifacts/windows-ui-release/installer-smoke

      - name: Smoke self-update progress, responsiveness, handoff, and restart
        shell: pwsh
        run: |
          ./scripts/update-smoke.ps1 `
            -Executable ./target/x86_64-pc-windows-msvc/release/flux-launcher.exe `
            -Installer ./artifacts/windows-ui-release/package/FluxLauncher-Setup.exe `
            -WorkDirectory ./artifacts/windows-ui-release/update-smoke `
            -CurrentVersion "${{ inputs.release_tag }}"

      - name: Publish user-facing UI release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Flux Launcher ${{ inputs.release_tag }}
          prerelease: ${{ inputs.release_channel == 'beta' }}
          make_latest: ${{ inputs.release_channel == 'stable' }}
          generate_release_notes: false
          body: |
            Flux Launcher Windows 11 x64 ${{ inputs.release_channel }} release.

            This release contains only the user-facing installer and portable executable. CI screenshots, DWM diagnostics, smoke logs, and test fixtures remain workflow artifacts rather than public downloads.

            Beta releases are for testing and are ignored by the stable updater. Stable releases are the versions intended for WinGet and normal automatic updates.
          files: |
            ./artifacts/windows-ui-release/package/FluxLauncher-Setup.exe
            ./artifacts/windows-ui-release/package/FluxLauncher-Portable.exe
