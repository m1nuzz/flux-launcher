name: Windows 发布

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release 标签，例如 v0.1.51"
        required: true
        type: string

      runner_label:
        description: "GitHub Windows runner 标签，标准环境使用 windows-latest"
        required: false
        default: windows-latest
        type: string

      release_channel:
        description: "发布通道"
        required: false
        default: beta
        type: choice
        options:
          - beta
          - stable

      publish_release:
        description: "仅在确认后创建或更新 GitHub Release"
        required: false
        default: false
        type: boolean

      release_notes:
        description: "发布说明；创建 Release 时必须填写人工校对的完整说明"
        required: false
        default: ""
        type: string

permissions:
  # contents: write 用于创建或更新 Release；actions: read 用于校验同 HEAD 的 CI 结果。
  contents: write
  actions: read

concurrency:
  group: windows-release-${{ inputs.release_tag }}
  # 发布任务不自动取消：同一 tag 的并发运行必须串行完成，由维护者决定如何处理。
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ inputs.runner_label || 'windows-latest' }}
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验同 HEAD 的 CI 结果
        shell: pwsh
        env:
          # 该步骤用 GITHUB_TOKEN 读取 Actions 运行记录，仓库授予 actions: read。
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          # 发布 workflow 不再重复执行与 CI 相同的全量测试，改为把「同 HEAD CI 成功」
          # 校验成事实：缺少成功记录时立即失败，避免在未验证的提交上构建发布产物。
          $json = gh run list `
            --repo $env:GH_REPO `
            --workflow ci.yml `
            --commit $env:TARGET_SHA `
            --limit 20 `
            --json status,conclusion

          if ($LASTEXITCODE -ne 0) {
            throw "gh run list 退出码 $LASTEXITCODE；无法校验 HEAD $env:TARGET_SHA 的 CI 结果。"
          }

          $runs = @($json | ConvertFrom-Json)

          if ($runs.Count -eq 0) {
            throw "未找到 HEAD $env:TARGET_SHA 的 CI 运行记录；请先推送并等待 CI 完成后再发布。"
          }

          $pending = @($runs | Where-Object { $_.status -ne 'completed' })
          if ($pending.Count -gt 0) {
            throw "HEAD $env:TARGET_SHA 的 CI 尚未完成（status=$($pending[0].status)）；等待 CI 结束后重试。"
          }

          $success = @($runs | Where-Object { $_.conclusion -eq 'success' })
          if ($success.Count -eq 0) {
            $conclusions = ($runs | ForEach-Object { $_.conclusion }) -join ', '
            throw "HEAD $env:TARGET_SHA 的 CI 未成功（conclusion=$conclusions）；修复 CI 后再发布。"
          }

          Write-Host "同 HEAD CI 校验通过：$env:TARGET_SHA（成功记录 $($success.Count) 条）"

      - name: 安装稳定版 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          # 与 CI 的缓存区分，避免两类运行互相挤占缓存条目。
          # key 编码 profile 与 lint 配置身份：lto、manifest 的 [lints] 等构建配置变更
          # 会使缓存产物失效而 key 不变，而 GitHub 缓存同 key 不可覆盖，此时必须同步
          # bump 此 key，否则旧缓存永远无法替换，导致每次全量重编（2026-09-20、2026-09-24 实测教训）。
          key: windows-release-lto-thin-lints

      - name: 读取并校验应用版本
        shell: pwsh
        env:
          # 自由文本输入通过环境变量传入，避免反引号、引号或 $ 改变 PowerShell 解析结果。
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          $cargoVersion = cargo metadata --no-deps --format-version 1 |
            ConvertFrom-Json |
            Select-Object -ExpandProperty packages |
            Where-Object { $_.name -eq "flux-launcher" } |
            Select-Object -ExpandProperty version

          if (-not $cargoVersion) {
            throw "无法从 Cargo metadata 获取 flux-launcher 版本。"
          }

          $releaseTag = $env:RELEASE_TAG

          # 稳定版必须是纯数字版本；beta 使用 SemVer 预发布标识（vX.Y.Z-beta.N）。
          if ($releaseTag -notmatch '^v\d+\.\d+\.\d+(\.\d+)?(-beta\.\d+)?$') {
            throw "Release 标签必须符合 vX.Y.Z 或 vX.Y.Z-beta.N 格式，实际为 '$releaseTag'。"
          }

          $tagVersion = $releaseTag.TrimStart("v")

          # Cargo 版本与 tag 版本（含预发布标识）必须逐字一致。
          if ($cargoVersion -ne $tagVersion) {
            throw "版本不一致：Cargo=$cargoVersion，release_tag=$tagVersion。"
          }

          if ($releaseChannel -eq 'stable' -and $tagVersion -match '-') {
            throw "稳定版发布不允许预发布版本号：release_tag=$tagVersion。"
          }

          # Inno 的 AppVersion/VersionInfoVersion 只接受纯数字点分格式，
          # 预发布标识单独导出，用于 AppVerName 显示与更新器冒烟的当前版本。
          $installerVersion = $tagVersion -replace '-.*$', ''
          "APP_VERSION=$cargoVersion" >> $env:GITHUB_ENV
          "APP_INSTALLER_VERSION=$installerVersion" >> $env:GITHUB_ENV
          Write-Host "应用版本：$cargoVersion"

      - name: 构建发布版本（并行安装 Inno Setup）
        shell: pwsh
        run: |
          # Inno Setup 安装与 Release 编译互不依赖，且 scripts/build-installer.ps1 通过显式
          # 路径查找 ISCC.exe（不依赖 PATH），因此后台安装、编译结束后再等待结果，
          # 把 choco 安装时间移出关键路径；安装失败仍会使本步骤失败。
          $innoJob = Start-Job -ScriptBlock {
            $output = choco install innosetup --no-progress --yes 2>&1
            [pscustomobject]@{
              ExitCode = $LASTEXITCODE
              Output   = $output
            }
          }

          cargo build --release `
            --target x86_64-pc-windows-msvc `
            -p flux-launcher `
            -p flow-plugin-fixture `
            -p flux-plugin-example

          $innoResult = Receive-Job -Job $innoJob -Wait
          $innoState = $innoJob.State
          Remove-Job -Job $innoJob
          $innoResult.Output | ForEach-Object { Write-Host $_ }
          if ($innoState -ne 'Completed' -or $innoResult.ExitCode -ne 0) {
            throw "Inno Setup 安装失败（job state=$innoState，choco exit=$($innoResult.ExitCode)）。"
          }

          $pluginRoot = Join-Path $env:APPDATA "FluxLauncher\Plugins\NativeFlowFixture"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $pluginRoot |
            Out-Null

          Copy-Item `
            ./tests/fixtures/flow-native-plugin/plugin.json `
            (Join-Path $pluginRoot "plugin.json") `
            -Force

          Copy-Item `
            ./target/x86_64-pc-windows-msvc/release/flow-plugin-fixture.exe `
            (Join-Path $pluginRoot "fixture-plugin.exe") `
            -Force

      - name: 验证原生插件 Named Pipe
        shell: pwsh
        run: |
          $nativeRoot = Join-Path $env:RUNNER_TEMP "flux-native-plugins"
          $nativePlugin = Join-Path $nativeRoot "example"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $nativePlugin |
            Out-Null

          Copy-Item `
            ./crates/flux-plugin-example/plugin.toml `
            (Join-Path $nativePlugin "plugin.toml") `
            -Force

          Copy-Item `
            ./target/x86_64-pc-windows-msvc/release/flux_plugin_example.dll `
            (Join-Path $nativePlugin "flux_plugin_example.dll") `
            -Force

          ./scripts/native-plugin-pipe-smoke.ps1 `
            -Executable ./target/x86_64-pc-windows-msvc/release/flux-launcher.exe `
            -PluginRoot $nativeRoot

      - name: 验证快捷方式图标
        shell: pwsh
        run: |
          ./scripts/shortcut-icon-smoke.ps1 `
            -Executable ./target/x86_64-pc-windows-msvc/release/flux-launcher.exe `
            -WorkDirectory ./artifacts/windows-ui-release/shortcut-icon-smoke

      - name: 验证单实例与 Everything 进程保护
        shell: pwsh
        run: |
          ./scripts/single-instance-smoke.ps1 `
            -Executable ./target/x86_64-pc-windows-msvc/release/flux-launcher.exe `
            -WorkDirectory ./artifacts/windows-ui-release/single-instance-smoke

      - name: 捕获 UI 状态并验证原生预览窗口
        shell: pwsh
        env:
          WINDUI_D2D: "1"
          FLUX_DISABLE_UPDATE_CHECKS: "1"
          FLUX_DISABLE_EVERYTHING_PROMPT: "1"
        run: |
          ./scripts/capture-mica.ps1 `
            -Executable ./target/x86_64-pc-windows-msvc/release/flux-launcher.exe `
            -OutputDirectory ./artifacts/windows-ui-release `
            -QueryResponsivenessSmoke `
            -ImeMessageSmoke `
            -FocusToggleSmoke `
            -DeactivationClickSmoke `
            -FolderLaunchSmoke `
            -ActionBarSmoke `
            -CommandPrioritySmoke `
            -ObsidianIconSmoke `
            -VisualSettingsSmoke

      - name: 上传 Windows UI 验证诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flux-launcher-windows-ui-smoke-diagnostics
          path: artifacts/windows-ui-release
          if-no-files-found: warn

      - name: 签名稳定版启动器
        if: inputs.release_channel == 'stable'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          ./scripts/sign-windows-release.ps1 `
            -Files @(
              "./target/x86_64-pc-windows-msvc/release/flux-launcher.exe"
            ) `
            -RequireSigning

      - name: 构建安装程序与便携版
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 `
            -AppVersion "$env:APP_INSTALLER_VERSION" `
            -DisplayVersion "$env:APP_VERSION" `
            -OutputDirectory ./artifacts/windows-ui-release/package

          Get-ChildItem `
            ./artifacts/windows-ui-release/package `
            -File `
            -Recurse |
            Get-FileHash -Algorithm SHA256 |
            Format-Table -AutoSize

      - name: 签名稳定版发布产物
        if: inputs.release_channel == 'stable'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          ./scripts/sign-windows-release.ps1 `
            -ArtifactDirectory ./artifacts/windows-ui-release/package `
            -RequireSigning

      - name: 验证安装、启动项、托盘启动与卸载
        shell: pwsh
        run: |
          ./scripts/installer-smoke.ps1 `
            -Installer ./artifacts/windows-ui-release/package/FluxLauncherCN-Setup.exe `
            -ExpectedExe ./target/x86_64-pc-windows-msvc/release/flux-launcher.exe `
            -WorkDirectory ./artifacts/windows-ui-release/installer-smoke

      - name: 验证自更新进度、响应性、交接与重启
        shell: pwsh
        run: |
          ./scripts/update-smoke.ps1 `
            -Executable ./target/x86_64-pc-windows-msvc/release/flux-launcher.exe `
            -Installer ./artifacts/windows-ui-release/package/FluxLauncherCN-Setup.exe `
            -WorkDirectory ./artifacts/windows-ui-release/update-smoke `
            -CurrentVersion "$env:APP_VERSION"

      - name: 上传 Windows 发布产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FluxLauncher-Windows11-x64
          path: artifacts/windows-ui-release/package
          if-no-files-found: error

      - name: 校验发布说明
        if: inputs.publish_release
        shell: pwsh
        env:
          # 发布说明是人工撰写的 Markdown，可能包含反引号、引号或 $；直接插值会破坏
          # PowerShell 解析（曾导致 release 运行在校验步骤报 ParserError）。
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_NOTES)) {
            throw "创建 GitHub Release 前必须填写人工校对的发布说明。"
          }

      - name: 创建或更新 GitHub Release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Flux Launcher CN ${{ inputs.release_tag }}
          prerelease: ${{ inputs.release_channel == 'beta' }}
          make_latest: ${{ inputs.release_channel == 'stable' }}
          generate_release_notes: false
          body: |
            ${{ inputs.release_notes }}

            ## 下载

            - [安装程序](https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}/FluxLauncherCN-Setup.exe)
            - [便携版](https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}/FluxLauncher-Portable.exe)

            ## Windows 验证

            该版本已运行 Windows UI、安装器及相关烟雾测试。
            GitHub Windows runner 的截图仅作为渲染路径证据，不能替代实体 Windows 11 上的 DWM Acrylic / Mica 观察。

            安装程序为主要下载项，便携版为次要下载项。

          files: |
            ./artifacts/windows-ui-release/package/FluxLauncherCN-Setup.exe
            ./artifacts/windows-ui-release/package/FluxLauncher-Portable.exe
