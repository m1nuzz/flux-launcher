name: Submit stable release to WinGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing stable release tag, for example v0.1.54"
        required: true
        type: string

permissions:
  contents: read

jobs:
  submit:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.release.prerelease == false)
    runs-on: windows-latest
    steps:
      - name: Require WinGet submission token
        shell: pwsh
        env:
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_GITHUB_TOKEN)) {
            throw "Configure the WINGET_GITHUB_TOKEN repository secret before running stable WinGet submission."
          }

      - name: Checkout Flux source
        uses: actions/checkout@v4
        with:
          path: flux-source
          fetch-depth: 1

      - name: Resolve and verify stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          RELEASE_TAG_FROM_INPUT: ${{ inputs.release_tag }}
          RELEASE_TAG_FROM_EVENT: ${{ github.event.release.tag_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") { $env:RELEASE_TAG_FROM_INPUT } else { $env:RELEASE_TAG_FROM_EVENT }
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -notmatch '^v\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Expected a semantic release tag such as v0.1.54, got '$tag'."
          }

          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isPrerelease,assets,url | ConvertFrom-Json
          if ($release.isPrerelease) {
            throw "Refusing to submit prerelease '$tag' to WinGet. Publish a stable release first."
          }

          $asset = @($release.assets | Where-Object { $_.name -eq "FluxLauncher-Setup.exe" })
          if ($asset.Count -ne 1) {
            throw "Stable release '$tag' must contain exactly one FluxLauncher-Setup.exe asset."
          }

          $downloadDirectory = Join-Path $env:RUNNER_TEMP "flux-winget-release"
          New-Item -ItemType Directory -Force -Path $downloadDirectory | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern "FluxLauncher-Setup.exe" --dir $downloadDirectory --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to download FluxLauncher-Setup.exe from stable release '$tag'."
          }

          $installerPath = Join-Path $downloadDirectory "FluxLauncher-Setup.exe"
          $installerHash = (Get-FileHash $installerPath -Algorithm SHA256).Hash
          $version = $tag.TrimStart("v")
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_SHA256=$installerHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_URL=$($release.url)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_PATH=$installerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Stable release $tag resolved with installer SHA256 $installerHash."

      - name: Update App Installer / WinGet
        shell: pwsh
        run: |
          winget upgrade --id Microsoft.AppInstaller --exact --accept-package-agreements --accept-source-agreements --disable-interactivity
          $upgradeExitCode = $LASTEXITCODE
          Start-Sleep -Seconds 3
          $versionText = (winget --version).Trim().TrimStart("v")
          $version = [version]$versionText
          if ($version -lt [version]"1.12.0") {
            throw "WinGet $versionText is too old for schema 1.12 validation (upgrade exit code $upgradeExitCode)."
          }
          if ($upgradeExitCode -ne 0) {
            Write-Host "App Installer reported exit code $upgradeExitCode after completing the upgrade; continuing with WinGet $versionText."
          }

      - name: Generate and validate manifest set
        shell: pwsh
        run: |
          Push-Location flux-source
          ./scripts/generate-winget-manifest.ps1 `
            -Version $env:VERSION `
            -InstallerSha256 $env:INSTALLER_SHA256 `
            -OutputRoot ../generated-winget/manifests `
            -ReleaseTag $env:RELEASE_TAG
          Pop-Location

          $manifestDirectory = Join-Path $env:GITHUB_WORKSPACE "generated-winget/manifests/m/m1nuzz/FluxLauncher/$env:VERSION"
          winget validate --manifest $manifestDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "WinGet manifest validation failed for $manifestDirectory."
          }

      - name: Checkout WinGet fork
        uses: actions/checkout@v4
        with:
          repository: m1nuzz/winget-pkgs
          ref: master
          path: winget-pkgs
          token: ${{ secrets.WINGET_GITHUB_TOKEN }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            manifests/m/m1nuzz/FluxLauncher
          sparse-checkout-cone-mode: true

      - name: Update fork and open official PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $branch = "flux-launcher-$env:VERSION"
          $existingPr = gh pr list --repo microsoft/winget-pkgs --state open --head "m1nuzz:$branch" --json number,url --jq '.[0] | "\(.number) \(.url)"'
          if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($existingPr)) {
            Write-Host "An official WinGet PR already exists for $env:VERSION: $existingPr"
            exit 0
          }

          Push-Location winget-pkgs
          git config user.name "m1nuzz"
          git config user.email "m1nusz0r@gmail.com"
          git remote add upstream https://github.com/microsoft/winget-pkgs.git
          git fetch --filter=blob:none upstream master
          git fetch origin master
          git ls-remote --exit-code --heads origin $branch *> $null
          if ($LASTEXITCODE -eq 0) {
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git switch -C $branch "origin/$branch"
          } else {
            git switch -c $branch upstream/master
          }

          $manifestDirectory = "manifests/m/m1nuzz/FluxLauncher/$env:VERSION"
          New-Item -ItemType Directory -Force -Path $manifestDirectory | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE/generated-winget/manifests/m/m1nuzz/FluxLauncher/$env:VERSION/*.yaml" $manifestDirectory -Force
          git add $manifestDirectory
          git diff --cached --check
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "The fork branch already contains the generated manifest set."
            Pop-Location
            exit 0
          }

          git commit -m "Add m1nuzz.FluxLauncher $env:VERSION manifest"
          git push --set-upstream origin $branch
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to push branch $branch to m1nuzz/winget-pkgs."
          }

          $packageExists = git ls-tree -r --name-only upstream/master "manifests/m/m1nuzz/FluxLauncher" | Select-Object -First 1
          $title = if ([string]::IsNullOrWhiteSpace($packageExists)) {
            "New package: m1nuzz.FluxLauncher version $env:VERSION"
          } else {
            "Update: m1nuzz.FluxLauncher to $env:VERSION"
          }
          $body = @"
          ## Description

          Automated stable release submission for `m1nuzz.FluxLauncher` version `$env:VERSION`.

          - Stable release: $env:RELEASE_URL
          - Installer: `FluxLauncher-Setup.exe` (Inno Setup, x64)
          - Installer SHA256: `$env:INSTALLER_SHA256`
          - Manifest validation: `winget validate --manifest`

          The release is published with `prerelease: false`. Beta releases are intentionally ignored by this workflow.
          "@
          $prUrl = gh pr create `
            --repo microsoft/winget-pkgs `
            --base master `
            --head "m1nuzz:$branch" `
            --title $title `
            --body $body
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to create the official WinGet pull request."
          }
          Write-Host "Created official WinGet PR: $prUrl"
          Pop-Location
