name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: Tests
        run: cargo test --workspace --target x86_64-pc-windows-msvc

      - name: Release build
        run: cargo build --workspace --release --target x86_64-pc-windows-msvc

      - name: Smoke Steam-style shortcut icon extraction
        shell: pwsh
        run: ./scripts/shortcut-icon-smoke.ps1 -Executable ./target/x86_64-pc-windows-msvc/release/flux-launcher.exe -WorkDirectory ./artifacts/shortcut-icon-smoke

      - name: Smoke single-instance and Everything process guard
        shell: pwsh
        run: ./scripts/single-instance-smoke.ps1 -Executable ./target/x86_64-pc-windows-msvc/release/flux-launcher.exe -WorkDirectory ./artifacts/single-instance-smoke

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: flux-launcher-windows-x64
          path: target/x86_64-pc-windows-msvc/release/flux-launcher.exe
          if-no-files-found: error
