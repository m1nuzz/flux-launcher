name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: Tests
        run: cargo test --workspace --target x86_64-pc-windows-msvc

      - name: Release build
        run: cargo build --workspace --release --target x86_64-pc-windows-msvc

      - name: Stage native Obsidian plugin
        shell: pwsh
        run: |
          $pluginDir = "target/x86_64-pc-windows-msvc/release/FluxPlugins/Obsidian"
          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null
          Copy-Item "crates/obsidian-plugin/plugin.json" "$pluginDir/plugin.json" -Force
          Copy-Item "target/x86_64-pc-windows-msvc/release/flux-obsidian-plugin.exe" "$pluginDir/flux-obsidian-plugin.exe" -Force
          $googleDir = "target/x86_64-pc-windows-msvc/release/FluxPlugins/Google"
          New-Item -ItemType Directory -Force -Path $googleDir | Out-Null
          Copy-Item "crates/google-plugin/plugin.json" "$googleDir/plugin.json" -Force
          Copy-Item "target/x86_64-pc-windows-msvc/release/flux-google-plugin.exe" "$googleDir/flux-google-plugin.exe" -Force

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: flux-launcher-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/flux-launcher.exe
            target/x86_64-pc-windows-msvc/release/FluxPlugins/
          if-no-files-found: error
