name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Windui regressions
        run: cargo test -p windui --no-default-features --features d2d --lib --target x86_64-pc-windows-msvc -- --nocapture

      - name: Whitespace
        run: git show --format= --check HEAD

      - name: Format
        run: cargo fmt --all -- --check

      - name: Windows GNU cross-check
        run: cargo check --workspace --target x86_64-pc-windows-gnu

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: Tests
        run: cargo test --workspace --target x86_64-pc-windows-msvc

      - name: Release build
        run: cargo build --workspace --release --target x86_64-pc-windows-msvc

      - name: Smoke Steam-style shortcut icon extraction
        shell: pwsh
        run: ./scripts/shortcut-icon-smoke.ps1 -Executable ./target/x86_64-pc-windows-msvc/release/flux-launcher.exe -WorkDirectory ./artifacts/shortcut-icon-smoke

      - name: Smoke single-instance and Everything process guard
        shell: pwsh
        run: ./scripts/single-instance-smoke.ps1 -Executable ./target/x86_64-pc-windows-msvc/release/flux-launcher.exe -WorkDirectory ./artifacts/single-instance-smoke

      - name: Smoke Recycle Bin confirmation flow
        shell: pwsh
        run: ./scripts/recycle-confirm-smoke.ps1 -Executable ./target/x86_64-pc-windows-msvc/release/flux-launcher.exe -WorkDirectory ./artifacts/recycle-confirm-smoke

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: flux-launcher-windows-x64
          path: target/x86_64-pc-windows-msvc/release/flux-launcher.exe
          if-no-files-found: error
