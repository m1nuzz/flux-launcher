name: Windows visual smoke

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Configured GitHub larger-runner label (use windows-latest for standard VM)"
        required: false
        default: windows-latest
        type: string
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mica-smoke:
    runs-on: ${{ inputs.runner_label || 'windows-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build launcher and native Flow fixture
        run: |
          cargo build --release --target x86_64-pc-windows-msvc -p flux-launcher -p flow-plugin-fixture
          $pluginRoot = Join-Path $env:APPDATA "FluxLauncher\Plugins\NativeFlowFixture"
          New-Item -ItemType Directory -Force -Path $pluginRoot | Out-Null
          Copy-Item ./tests/fixtures/flow-native-plugin/plugin.json (Join-Path $pluginRoot "plugin.json") -Force
          Copy-Item ./target/x86_64-pc-windows-msvc/release/flow-plugin-fixture.exe (Join-Path $pluginRoot "fixture-plugin.exe") -Force

      - name: Enable DWM effects and collect preflight diagnostics
        shell: pwsh
        run: ./scripts/enable-dwm-smoke.ps1 -OutputDirectory ./artifacts/mica-smoke

      - name: Capture desktop compositor output
        shell: pwsh
        env:
          WINDUI_D2D: "1"
        run: |
          ./scripts/capture-mica.ps1 `
            -Executable ./target/x86_64-pc-windows-msvc/release/flux-launcher.exe `
            -OutputDirectory ./artifacts/mica-smoke

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: mica-smoke
          path: artifacts/mica-smoke
