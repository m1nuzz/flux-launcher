name: Windows visual smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mica-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Mica probe
        run: cargo build --release --target x86_64-pc-windows-msvc -p flux-launcher

      - name: Capture desktop compositor output
        shell: pwsh
        run: >
          ./scripts/capture-mica.ps1
          -Executable ./target/x86_64-pc-windows-msvc/release/flux-launcher.exe
          -OutputDirectory ./artifacts/mica-smoke

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: mica-smoke
          path: artifacts/mica-smoke
