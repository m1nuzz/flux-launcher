name: Windows visual smoke

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Configured GitHub larger-runner label (use windows-latest for standard VM)"
        required: false
        default: windows-latest
        type: string
      force_translucent_fallback:
        description: "Force the non-DWM uniform-alpha fallback instead of system Acrylic"
        required: false
        default: false
        type: boolean
      navigation_query:
        description: "Optional targeted query for monotonic Down navigation smoke"
        required: false
        default: wab
        type: string
      navigation_cycles:
        description: "Number of monotonic Down presses after the query for viewport-scroll regression"
        required: false
        default: "0"
        type: string
      tab_navigation_cycles:
        description: "Number of Tab/Shift+Tab result-navigation cycles after the query"
        required: false
        default: "0"
        type: string
      pointer_interaction_smoke:
        description: "Exercise result hover selection, wheel scrolling, and mouse click"
        required: false
        default: false
        type: boolean
      everything_missing_smoke:
        description: "Exercise the English Everything-not-installed Settings prompt without installing"
        required: false
        default: false
        type: boolean
      recycle_bin_smoke:
        description: "Exercise Recycle Bin search and action mode without emptying it"
        required: false
        default: false
        type: boolean
      cursor_visibility_smoke:
        description: "Verify cursor visible on activation, hidden while typing, restored on mouse movement"
        required: false
        default: false
        type: boolean
      scrollbar_gap_smoke:
        description: "Capture result list scrollbar spacing after mouse-wheel scrolling"
        required: false
        default: false
        type: boolean
      query_clear_on_reopen_smoke:
        description: "Verify repeated Alt+Space reopens with a clean search field and no stale query flash"
        required: false
        default: false
        type: boolean
      ctrl_r_smoke:
        description: "Verify Ctrl+R launches the selected result with Windows elevation"
        required: false
        default: false
        type: boolean
      ctrl_c_smoke:
        description: "Verify Ctrl+C copies the selected result path in quotes"
        required: false
        default: false
        type: boolean
      tray_settings_smoke:
        description: "Exercise the tray Settings show lifecycle before measuring the panel"
        required: false
        default: false
        type: boolean
      visual_settings_smoke:
        description: "Open Visual Settings, measure the real preview HWND client geometry at DPI, verify realtime slider/reset IPC, stable Settings, and cleanup"
        required: false
        default: false
        type: boolean
      resource_profile_smoke:
        description: "Run a bounded repeated-query process resource profile and record memory/CPU samples"
        required: false
        default: false
        type: boolean
      monitor_preference_smoke:
        description: "Run Primary/Cursor/Foreground monitor placement smoke"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mica-smoke:
    runs-on: ${{ inputs.runner_label || 'windows-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build launcher and native Flow fixture
        run: |
          cargo build --release --target x86_64-pc-windows-msvc -p flux-launcher -p flow-plugin-fixture
          $pluginRoot = Join-Path $env:APPDATA "FluxLauncher\Plugins\NativeFlowFixture"
          New-Item -ItemType Directory -Force -Path $pluginRoot | Out-Null
          Copy-Item ./tests/fixtures/flow-native-plugin/plugin.json (Join-Path $pluginRoot "plugin.json") -Force
          Copy-Item ./target/x86_64-pc-windows-msvc/release/flow-plugin-fixture.exe (Join-Path $pluginRoot "fixture-plugin.exe") -Force

      - name: Enable DWM effects and collect preflight diagnostics
        shell: pwsh
        run: ./scripts/enable-dwm-smoke.ps1 -OutputDirectory ./artifacts/mica-smoke

      - name: Capture desktop compositor output
        shell: pwsh
        env:
          WINDUI_D2D: "1"
          FLUX_DISABLE_UPDATE_CHECKS: "1"
          FLUX_DISABLE_EVERYTHING_PROMPT: "1"
        run: |
          $captureParams = @{
            Executable = "./target/x86_64-pc-windows-msvc/release/flux-launcher.exe"
            OutputDirectory = "./artifacts/mica-smoke"
            ScrollbarGapSmoke = $true
            ActionBarSmoke = $true
          }
          if ("${{ inputs.force_translucent_fallback }}" -eq "true") {
            $captureParams.ForceTranslucentFallback = $true
          }
          if ("${{ inputs.navigation_query }}" -ne "") {
            $captureParams.NavigationQuery = "${{ inputs.navigation_query }}"
          }
          if ("${{ inputs.navigation_cycles }}" -ne "") {
            $captureParams.NavigationCycles = [int]"${{ inputs.navigation_cycles }}"
          }
          if ("${{ inputs.tab_navigation_cycles }}" -ne "") {
            $captureParams.TabNavigationCycles = [int]"${{ inputs.tab_navigation_cycles }}"
          }
          if ("${{ inputs.pointer_interaction_smoke }}" -eq "true") {
            $captureParams.PointerInteractionSmoke = $true
          }
          if ("${{ inputs.everything_missing_smoke }}" -eq "true") {
            $captureParams.EverythingMissingSmoke = $true
          }
          if ("${{ inputs.recycle_bin_smoke }}" -eq "true") {
            $captureParams.RecycleBinSmoke = $true
          }
          if ("${{ inputs.cursor_visibility_smoke }}" -eq "true") {
            $captureParams.CursorVisibilitySmoke = $true
          }
          if ("${{ inputs.scrollbar_gap_smoke }}" -eq "true") {
            $captureParams.ScrollbarGapSmoke = $true
          }
          if ("${{ inputs.query_clear_on_reopen_smoke }}" -eq "true") {
            $captureParams.QueryClearOnReopenSmoke = $true
          }
          if ("${{ inputs.ctrl_r_smoke }}" -eq "true") {
            $captureParams.CtrlRSmoke = $true
          }
          if ("${{ inputs.ctrl_c_smoke }}" -eq "true") {
            $captureParams.CtrlCSmoke = $true
          }
          if ("${{ inputs.tray_settings_smoke }}" -eq "true") {
            $captureParams.TraySettingsSmoke = $true
          }
          if ("${{ inputs.visual_settings_smoke }}" -eq "true") {
            $captureParams.VisualSettingsSmoke = $true
          }
          if ("${{ inputs.resource_profile_smoke }}" -eq "true") {
            $captureParams.ResourceProfileSmoke = $true
          }
          $captureParams.IdlePerformanceSmoke = $true
          $captureParams.FocusToggleSmoke = $true
          $captureParams.DeactivationClickSmoke = $true
          $captureParams.FolderLaunchSmoke = $true
          & ./scripts/capture-mica.ps1 @captureParams

      - name: Upload launcher binary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: flux-launcher-windows-x64-smoke
          path: target/x86_64-pc-windows-msvc/release/flux-launcher.exe
          if-no-files-found: error

      - name: Test monitor preference modes
        if: ${{ inputs.monitor_preference_smoke == true || github.event_name == 'push' }}
        shell: pwsh
        run: ./scripts/monitor-preference-smoke.ps1 -Executable ./target/x86_64-pc-windows-msvc/release/flux-launcher.exe -OutputDirectory ./artifacts/mica-smoke

      - name: Upload visual evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mica-smoke
          path: artifacts/mica-smoke
