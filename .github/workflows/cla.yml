name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/m1nuzz/flux-launcher/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'm1nuzz,m1nus,bot*'
          custom-notsigned-prcomment: 'Thanks for your contribution! Before this pull request can be merged, please read the [CLA](https://github.com/m1nuzz/flux-launcher/blob/main/CLA.md) and sign it by commenting exactly: I have read the CLA Document and I hereby sign the CLA'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'CLA signed. Thank you!'
          lock-pullrequest-aftermerge: true
