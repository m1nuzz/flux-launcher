name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        id: cla
        if: (github.event.comment.body == 'recheck' || startsWith(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')) || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/m1nuzz/flux-launcher/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'm1nuzz,m1nus,bot*'
          custom-notsigned-prcomment: 'Thanks for your contribution! Before this pull request can be merged, please read the [CLA](https://github.com/m1nuzz/flux-launcher/blob/main/CLA.md) and sign it by commenting exactly: I have read the CLA Document and I hereby sign the CLA'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'CLA signed. Thank you!'
          lock-pullrequest-aftermerge: true

      - name: Sync the CLA label
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          CLA_OUTCOME: ${{ steps.cla.outcome }}
        with:
          script: |
            const outcome = process.env.CLA_OUTCOME;
            if (outcome !== 'success' && outcome !== 'failure') return;
            const pullRequest = context.payload.pull_request ?? context.payload.issue;
            if (!pullRequest || pullRequest.state !== 'open') return;
            const labelName = 'Needs-CLA';
            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });
            const hasLabel = labels.some((label) => label.name.toLowerCase() === labelName.toLowerCase());
            if (outcome === 'failure' && !hasLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                labels: [labelName],
              });
            } else if (outcome === 'success' && hasLabel) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                name: labelName,
              });
            }
