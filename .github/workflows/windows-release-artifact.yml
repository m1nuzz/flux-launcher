name: Windows release artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binaries
        shell: pwsh
        run: |
          cargo build --release --target x86_64-pc-windows-msvc -p flux-launcher -p flow-plugin-fixture -p flux-obsidian-plugin
          New-Item -ItemType Directory -Force -Path artifacts/FluxLauncher-Windows11-x64/FluxPlugins/Obsidian | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/flux-launcher.exe artifacts/FluxLauncher-Windows11-x64/FluxLauncher-Windows11-x64.exe
          Copy-Item target/x86_64-pc-windows-msvc/release/flow-plugin-fixture.exe artifacts/FluxLauncher-Windows11-x64/flow-plugin-fixture.exe
          Copy-Item crates/obsidian-plugin/plugin.json artifacts/FluxLauncher-Windows11-x64/FluxPlugins/Obsidian/plugin.json
          Copy-Item target/x86_64-pc-windows-msvc/release/flux-obsidian-plugin.exe artifacts/FluxLauncher-Windows11-x64/FluxPlugins/Obsidian/flux-obsidian-plugin.exe
          Get-ChildItem artifacts/FluxLauncher-Windows11-x64 -File -Recurse | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxLauncher-Windows11-x64
          path: artifacts/FluxLauncher-Windows11-x64
