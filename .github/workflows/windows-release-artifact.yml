name: Windows release artifact

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Installer/package version, for example 0.1.51"
        required: false
        default: "0.1.51"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build release binaries
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc -p flux-launcher -p flow-plugin-fixture

      - name: Build installer and portable package
        shell: pwsh
        run: ./scripts/build-installer.ps1 -AppVersion "${{ inputs.app_version }}"

      - name: Smoke installer and uninstall
        shell: pwsh
        run: |
          ./scripts/installer-smoke.ps1 `
            -Installer ./artifacts/FluxLauncher-Windows11-x64/FluxLauncher-Setup.exe `
            -ExpectedExe ./target/x86_64-pc-windows-msvc/release/flux-launcher.exe `
            -WorkDirectory ./artifacts/installer-smoke

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxLauncher-Windows11-x64
          path: artifacts/FluxLauncher-Windows11-x64
