[package]
name = "flux-plugin-example"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

description = "Example native Rust community plugin for Flux Launcher."

[lib]
crate-type = ["cdylib"]

[dependencies]
flux-plugin-sdk = { path = "../flux-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
