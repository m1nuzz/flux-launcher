[package]
name = "flux-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A lightweight Windows launcher built with Rust and windui."

[dependencies]
flux-core = { path = "../flux-core" }
flux-plugin-sdk = { path = "../flux-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windui = { path = "../../vendor/windui", default-features = false, features = ["d2d"] }
png = "0.17"
libloading = "0.8"
toml = "0.8"
semver = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
everything-ipc = "0.1.4"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell_PropertiesSystem",
] }
