[workspace]
members = [
    "crates/flow-plugin-fixture",
    "crates/flux-core",
    "crates/flux-launcher",
    "crates/flux-plugin-sdk",
    "crates/flux-plugin-example",
]
default-members = ["crates/flux-launcher"]
resolver = "2"

[workspace.package]
version = "0.2.0-beta.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["lvxingqi <lvxingqi2000@gmail.com>"]
repository = "https://github.com/lvxingqi/flux-launcher-cn"

# 成员 crate 的公共 lint 门槛，由各成员以 `[lints] workspace = true` 选择性启用。
# 作用域仅限声明它的包，路径依赖（vendor/windui）不受影响——这是不用命令行 `-D` 的原因。
# unused_qualifications：已导入却仍写完整路径；too_many_lines 的阈值见根 clippy.toml。
[workspace.lints.rust]
unused_qualifications = "deny"

[workspace.lints.clippy]
too_many_lines = "deny"

[profile.release]
opt-level = "z"
# 使用 thin LTO：fat LTO（true）在 codegen-units = 1 下对最终二进制做单线程位码优化，
# 是 workspace 成员编译的主要成本（实测 flux-launcher 单元 63.5s vs thin 约 30s），
# 代价是产物体积约 +7.6%（exe 3.70 MB → 3.98 MB），不影响运行时内存与行为。
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-perf]
inherits = "release"
opt-level = 3
